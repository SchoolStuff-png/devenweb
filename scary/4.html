<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flying Fours Physics</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
            font-family: sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <canvas id="physicsCanvas"></canvas>

    <script>
        const canvas = document.getElementById('physicsCanvas');
        const ctx = canvas.getContext('2d');

        // Set canvas size to fill the screen
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const fours = [];
        const gravity = 0.2;
        const friction = 0.99; // Air resistance
        const bounce = 0.7;    // Restitution (bounciness)
        const radius = 24;     // Collision radius for each '4'

        class Four {
            constructor() {
                this.x = -radius; 
                this.y = Math.random() * (canvas.height * 0.6) + (canvas.height * 0.1);
                this.vx = Math.random() * 5 + 5; // Fly in to the right
                this.vy = (Math.random() - 0.5) * 5;
                this.radius = radius;
                this.mass = 1;
                this.angle = Math.random() * Math.PI * 2;
                this.angularVelocity = (Math.random() - 0.5) * 0.1;
            }

            update() {
                this.vy += gravity;
                this.vx *= friction;
                this.vy *= friction;
                this.x += this.vx;
                this.y += this.vy;
                this.angle += this.angularVelocity;

                // Wall collisions (Left, Right, Bottom)
                if (this.x + this.radius > canvas.width) {
                    this.x = canvas.width - this.radius;
                    this.vx *= -bounce;
                } else if (this.x - this.radius < 0 && this.vx < 0) {
                    this.x = this.radius;
                    this.vx *= -bounce;
                }

                if (this.y + this.radius > canvas.height) {
                    this.y = canvas.height - this.radius;
                    this.vy *= -bounce;
                    this.vx *= 0.95; // Ground friction
                    this.angularVelocity *= 0.9;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.fillStyle = '#000000';
                ctx.font = 'bold 48px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('4', 0, 0);
                ctx.restore();
            }
        }

        // Handle collision between two fours
        function resolveCollision(f1, f2) {
            const xDist = f2.x - f1.x;
            const yDist = f2.y - f1.y;
            const distance = Math.hypot(xDist, yDist);

            // Check if they overlap
            if (distance < f1.radius + f2.radius) {
                // Prevent overlapping by separating them
                const overlap = (f1.radius + f2.radius) - distance;
                const overlapX = (xDist / distance) * overlap * 0.5;
                const overlapY = (yDist / distance) * overlap * 0.5;
                
                f1.x -= overlapX;
                f1.y -= overlapY;
                f2.x += overlapX;
                f2.y += overlapY;

                // Physics equations for elastic collision
                const nx = xDist / distance;
                const ny = yDist / distance;

                const kx = f1.vx - f2.vx;
                const ky = f1.vy - f2.vy;
                const p = 2 * (nx * kx + ny * ky) / (f1.mass + f2.mass);

                f1.vx -= p * f2.mass * nx * bounce;
                f1.vy -= p * f2.mass * ny * bounce;
                f2.vx += p * f1.mass * nx * bounce;
                f2.vy += p * f1.mass * ny * bounce;
                
                // Add a tiny bit of spin on impact
                f1.angularVelocity += (Math.random() - 0.5) * 0.05;
                f2.angularVelocity += (Math.random() - 0.5) * 0.05;
            }
        }

        // Automatically spawn a new '4' every half second
        setInterval(() => {
            if (fours.length < 100) { // Limit total count for performance
                fours.push(new Four());
            }
        }, 500);

        // Animation Loop
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Check for collisions between pairs
            for (let i = 0; i < fours.length; i++) {
                for (let j = i + 1; j < fours.length; j++) {
                    resolveCollision(fours[i], fours[j]);
                }
            }

            // Update and draw each four
            fours.forEach(four => {
                four.update();
                four.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
