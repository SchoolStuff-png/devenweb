<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris DX</title>
    <style>
        body { background-color: #000; color: #fff; text-align: center; font-family: sans-serif; }
        canvas { width: 480px; height: 432px; border: 2px solid #333; background: #111; image-rendering: pixelated; }
    </style>
</head>
<body>

    <h1 id="status">Loading Tetris DX...</h1>
    
    <!-- Canvas element for outputting video -->
    <canvas id="canvas" width="160" height="144" oncontextmenu="event.preventDefault()"></canvas>

    <script>
        var Module = {
            noInitialRun: false,
            
            // Pass the .gbc ROM directly to the Gambatte runtime
            arguments: ["TetrisDx.gbc"], 
            
            canvas: document.getElementById('canvas'),
            
            // Pre-load the ROM file from your web server into virtual memory
            preRun: [function() {
                console.log("Downloading ROM file from server into virtual memory...");
                
                Module.FS_createPreloadedFile(
                    "/", 
                    "TetrisDx.gbc", 
                    "TetrisDx.gbc", // Ensures path matches your server directory
                    true, 
                    false
                );
            }],
            
            postRun: [function() {
                console.log("Gambatte initialized successfully!");
                document.getElementById('status').innerText = "Playing: Tetris DX";
            }]
        };
    </script>

    <!-- Load the Gambatte emulator script -->
    <script async src="gambatte.js"></script>

</body>
</html>
