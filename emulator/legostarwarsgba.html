<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Star Wars</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        #canvas {
            border: 2px solid #444;
            background-color: #000;
            max-width: 100%;
            height: auto;
            aspect-ratio: 3 / 2; /* GBA aspect ratio */
        }
        .controls {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    
    <div class="controls">
        <p><strong>Controls:</strong> Arrow Keys = D-Pad | Z = A | X = B | A = L | S = R | Enter = Start | Shift = Select</p>
    </div>

    <script>
        // Setup the Module object required by Emscripten (RetroArch web core)
        var Module = {
            noInitialRun: false,
            arguments: ["/legostarwars.gba"], // Directs RetroArch to auto-load the rom from the virtual filesystem
            canvas: document.getElementById('canvas'),
            
            preRun: [function() {
                // Fetch the local GBA file and write it to Emscripten's virtual filesystem
                try {
                    Module.FS_createPreloadedFile('/', 'legostarwars.gba', 'legostarwars.gba', true, false);
                } catch(e) {
                    console.error("Error preloading ROM:", e);
                }
            }],
            
            postRun: [],
            
            print: function(text) { console.log(text); },
            printErr: function(text) { console.error(text); }
        };
    </script>

    <!-- Load the RetroArch Emscripten core script -->
    <script async src="vba_next.js"></script>

</body>
</html>
