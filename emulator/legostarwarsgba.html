<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEGO Star Wars</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #ffe81f;
            margin-bottom: 5px;
        }
        h2 {
            font-size: 1.2rem;
            color: #aaaaaa;
            margin-top: 0;
        }
        #emulator-container {
            width: 480px;
            height: 320px;
            background-color: #000;
            margin: 20px auto;
            border: 4px solid #333;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        /* Fix: Ensures canvas scales correctly in fullscreen */
        #emulator-container:fullscreen {
            width: 100vw;
            height: 100vh;
            border: none;
            border-radius: 0;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .btn-group {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        button {
            background-color: #ffe81f;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover { background-color: #e6cf1c; }
        button.secondary { background-color: #444; color: #fff; }
        button.secondary:hover { background-color: #555; }
        .status-message {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #2ecc71;
            min-height: 20px;
        }
        .panel {
            background-color: #1e1e1e;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            text-align: left;
        }
        .panel h3 { margin-top: 0; color: #ffe81f; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .key-mapping { display: flex; justify-content: space-between; background: #2a2a2a; padding: 6px 12px; border-radius: 4px; font-size: 0.9rem; }
        .key { background: #444; padding: 2px 6px; border-radius: 3px; font-family: monospace; font-weight: bold; color: #ffe81f; }
    </style>
</head>
<body>

<div class="container">
    <h1>LEGO® Star Wars</h1>
    <h2>The Video Game (GBA)</h2>

    <div id="emulator-container">
        <!-- Fix: Replaced placeholder text with the actual rendering canvas -->
        <canvas id="canvas" tabindex="-1"></canvas>
    </div>

    <div class="btn-group">
        <button id="fullscreen-btn" class="secondary">📺 Fullscreen</button>
    </div>
    
    <div class="status-message" id="status-log">Loading ROM...</div>

    <div class="panel">
        <h3>Controls Configuration</h3>
        <div class="grid">
            <div class="key-mapping"><span>D-Pad (Move)</span><span class="key">Arrow Keys</span></div>
            <div class="key-mapping"><span>A Button</span><span class="key">X</span></div>
            <div class="key-mapping"><span>B Button</span><span class="key">Z</span></div>
            <div class="key-mapping"><span>L Shoulder</span><span class="key">Q</span></div>
            <div class="key-mapping"><span>R Shoulder</span><span class="key">W</span></div>
            <div class="key-mapping"><span>Start Button</span><span class="key">Enter</span></div>
            <div class="key-mapping"><span>Select Button</span><span class="key">Shift</span></div>
        </div>
    </div>
</div>

<script>
    const statusLog = document.getElementById('status-log');
    const romFile = "LEGO Star Wars - The Video Game (UE).gba";
    const coreFile = "vba_next.js";

    function showStatus(message, isError = false) {
        statusLog.textContent = message;
        statusLog.style.color = isError ? "#e74c3c" : "#2ecc71";
    }

    // Fix: Emscripten Module setup to mount the ROM and link the canvas
    var Module = {
        canvas: document.getElementById('canvas'),
        arguments: ['/game.gba'], // The virtual path RetroArch will load
        preRun: [],
        postRun: [],
        print: (function() {
            return function(text) { console.log(text); };
        })(),
        printErr: function(text) { console.error(text); }
    };

    // Fix: Fetch the ROM asynchronously, inject it into the virtual filesystem, then load the emulator core
    async function loadGame() {
        try {
            const response = await fetch(romFile);
            if (!response.ok) throw new Error("ROM not found. Ensure the filename matches exactly.");
            
            const buffer = await response.arrayBuffer();
            const romData = new Uint8Array(buffer);

            // Instruct Emscripten to create the virtual file right before running
            Module.preRun.push(function() {
                FS.createDataFile('/', 'game.gba', romData, true, true);
            });

            // Load the emulator core script
            const script = document.createElement('script');
            script.src = coreFile;
            script.onload = () => showStatus("Emulator running.");
            script.onerror = () => showStatus("Error loading vba_next.js.", true);
            document.body.appendChild(script);

        } catch (error) {
            showStatus(error.message, true);
        }
    }

    // Fullscreen Handler
    function toggleFullscreen() {
        const container = document.getElementById('emulator-container');
        if (!document.fullscreenElement) {
            container.requestFullscreen().catch(err => {
                showStatus(`Error enabling fullscreen: ${err.message}`, true);
            });
        } else {
            document.exitFullscreen();
        }
    }

    document.getElementById('fullscreen-btn').addEventListener('click', toggleFullscreen);

    // Initialize game load sequence
    loadGame();
</script>

</body>
</html>
