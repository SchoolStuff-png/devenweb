<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEGO Star Wars - Game Boy Advance Emulator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #ffe81f; /* Star Wars Yellow */
            margin-bottom: 5px;
        }
        h2 {
            font-size: 1.2rem;
            color: #aaaaaa;
            margin-top: 0;
        }
        #emulator-container {
            width: 480px;
            height: 320px;
            background-color: #000;
            margin: 20px auto;
            border: 4px solid #333;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        #emulator-container:fullscreen {
            width: 100vw;
            height: 100vh;
            border: none;
            border-radius: 0;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .panel {
            background-color: #1e1e1e;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            text-align: left;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .panel h3 {
            margin-top: 0;
            color: #ffe81f;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .key-mapping {
            display: flex;
            justify-content: space-between;
            background: #2a2a2a;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.9rem;
        }
        .key {
            background: #444;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: monospace;
            font-weight: bold;
            color: #ffe81f;
        }
        .btn-group {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        button {
            background-color: #ffe81f;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: #e6cf1c;
            transform: translateY(-1px);
        }
        button:active {
            transform: translateY(1px);
        }
        button.secondary {
            background-color: #444;
            color: #fff;
        }
        button.secondary:hover {
            background-color: #555;
        }
        .status-message {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #2ecc71;
            min-height: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 id="game-title">LEGO® Star Wars</h1>
    <h2>The Video Game (GBA)</h2>

    <div id="emulator-container">
        <!-- The canvas element used by vba_next.js to render video -->
        <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    </div>

    <div class="btn-group">
        <button id="save-btn">💾 Save SRAM to Browser</button>
        <button id="load-btn" class="secondary">📂 Restore Save Data</button>
        <button id="fullscreen-btn" class="secondary">📺 Fullscreen</button>
    </div>
    
    <div class="status-message" id="status-log">Loading ROM file...</div>

    <div class="panel">
        <h3>Controls Configuration</h3>
        <div class="grid">
            <div class="key-mapping"><span>D-Pad (Move)</span><span class="key">Arrow Keys</span></div>
            <div class="key-mapping"><span>A Button</span><span class="key">X</span></div>
            <div class="key-mapping"><span>B Button</span><span class="key">Z</span></div>
            <div class="key-mapping"><span>L Shoulder</span><span class="key">A</span></div>
            <div class="key-mapping"><span>R Shoulder</span><span class="key">S</span></div>
            <div class="key-mapping"><span>Start Button</span><span class="key">Enter</span></div>
            <div class="key-mapping"><span>Select Button</span><span class="key">Shift</span></div>
        </div>
    </div>
</div>

<script>
    const STORAGE_KEY_SAVE = "legostarwars_sram_data";
    const statusLog = document.getElementById('status-log');
    const romFileName = "legostarwars.gba";

    function showStatus(message, isError = false) {
        statusLog.textContent = message;
        statusLog.style.color = isError ? "#e74c3c" : "#2ecc71";
    }

    // Module initialization configured for your working vba_next.js core
    var Module = {
        noInitialRun: false,
        arguments: [romFileName], 
        canvas: document.getElementById('canvas'),
        
        preRun: [function() {
            console.log("Loading ROM file into virtual filesystem...");
            Module.FS_createPreloadedFile(
                "/", 
                romFileName, 
                romFileName, 
                true, 
                false
            );
        }],
        
        postRun: [function() {
            showStatus("Emulator loaded successfully! Click screen if audio/controls don't respond immediately.");
            restoreSaveFromStorage();
        }]
    };

    // Save/Restore functions for battery SRAM save data
    function saveToLocalStorage() {
        try {
            // Save state data from virtual filesystem if present
            if (typeof FS !== 'undefined') {
                const savePaths = [`/${romFileName}.sav`, `/legostarwars.sav`];
                let saved = false;

                for (let path of savePaths) {
                    try {
                        const data = FS.readFile(path);
                        const base64Data = btoa(String.fromCharCode.apply(null, data));
                        localStorage.setItem(STORAGE_KEY_SAVE, base64Data);
                        saved = true;
                        break;
                    } catch (e) {
                        // File not found yet in FS, continue checking
                    }
                }

                if (saved) {
                    showStatus("In-game save successfully backed up to LocalStorage!");
                } else {
                    showStatus("No in-game save file found yet. Save your game inside LEGO Star Wars first!", true);
                }
            }
        } catch (error) {
            console.error(error);
            showStatus("Failed to save state to LocalStorage.", true);
        }
    }

    function restoreSaveFromStorage() {
        try {
            const savedData = localStorage.getItem(STORAGE_KEY_SAVE);
            if (savedData && typeof FS !== 'undefined') {
                const binaryString = atob(savedData);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                FS.writeFile(`/${romFileName}.sav`, bytes);
                showStatus("Existing save data restored to emulator!");
            }
        } catch (error) {
            console.error("Failed to restore save:", error);
        }
    }

    // Fullscreen behavior
    function toggleFullscreen() {
        const container = document.getElementById('emulator-container');
        if (!document.fullscreenElement) {
            container.requestFullscreen().catch(err => {
                showStatus(`Fullscreen error: ${err.message}`, true);
            });
        } else {
            document.exitFullscreen();
        }
    }

    document.getElementById('save-btn').addEventListener('click', saveToLocalStorage);
    document.getElementById('load-btn').addEventListener('click', restoreSaveFromStorage);
    document.getElementById('fullscreen-btn').addEventListener('click', toggleFullscreen);
</script>

<!-- Asynchronously load the emulator script matching your original setup -->
<script async src="vba_next.js"></script>

</body>
</html>
