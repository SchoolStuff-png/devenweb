  <div class="purple-checker-banner">
    <div class="banner-content">
      <!-- Group 1: The original text set -->
      <span><strong></strong></span>
      <span><strong></strong></span>
      
      <!-- Group 2: The exact duplicate set to allow a seamless, jump-free loop -->
      <span><strong></strong></span>
      <span><strong></strong></span>
    </div>
  </div>
  <style>
    body {
      margin: 0; /* Clears default margins completely */
    }
    .purple-checker-banner {
      width: 100%;
      height: 60px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      /* White background base */
      background-color: #ffffff;
      /* CSS Checkerboard Pattern */
      background-image: linear-gradient(45deg, #f3f0fa 25%, transparent 25%), 
                        linear-gradient(-45deg, #f3f0fa 25%, transparent 25%), 
                        linear-gradient(45deg, transparent 75%, #f3f0fa 75%), 
                        linear-gradient(-45deg, transparent 75%, #f3f0fa 75%);
      background-size: 24px 24px;
      background-position: 0 0, 0 12px, 12px -12px, -12px 0px;
      border-bottom: 2px solid #7c5cb7;
      z-index: 9999;
      /* Animates the checkerboard background */
      animation: moveCheckerboard 4s linear infinite;
    }
    .banner-content {
      display: flex;
      white-space: nowrap;
      color: #4a3e65;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 16px;
      font-weight: 700;
      z-index: 2;
      
      /* Pushes the starting point of the text to the middle of the screen */
      padding-left: 50vw; 
      
      /* Animates the text scrolling */
      animation: scrollText 15s linear infinite;
    }
    /* Adjust spacing between repeating text blocks */
    .banner-content span {
      padding-right: 50px;
    }
    /* Keyframes for the diagonal moving checkerboard */
    @keyframes moveCheckerboard {
      0% {
        background-position: 0 0, 0 12px, 12px -12px, -12px 0px;
      }
      100% {
        background-position: 24px 24px, 24px 36px, 36px 12px, 12px 24px;
      }
    }
    /* The core mechanics of a seamless marquee loop */
    @keyframes scrollText {
      0% {
        transform: translate3d(0, 0, 0);
      }
      100% {
        /* Translating exactly -50% aligns the duplicated text perfectly with the starting frame, preventing any jump */
        transform: translate3d(-50%, 0, 0);
      }
    }
  </style>
</body>
