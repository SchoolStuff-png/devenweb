  <style> 
    body { 
      margin: 0; 
    .purple-checker-banner { 
      width: 100%; 
      height: 60px; 
      position: relative; 
      overflow: hidden; 
      display: flex; 
      align-items: center; 
      
      background-color: #1a1a1a; 
     
      background-image: 
        linear-gradient(45deg, #ff7518 25%, transparent 25%), 
        linear-gradient(-45deg, #ff7518 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #ff7518 75%), 
        linear-gradient(-45deg, transparent 75%, #ff7518 75%); 
      background-size: 24px 24px; 
      background-position: 0 0, 0 12px, 12px -12px, -12px 0px; 
      
      border-bottom: 3px solid #000000; 
      z-index: 9999; 
     
      animation: moveCheckerboard 4s linear infinite; 
    } 
    .banner-content { 
      display: flex; 
      white-space: nowrap; 
    
      color: #ffffff; 
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      font-size: 16px; 
      font-weight: 700; 
      z-index: 2; 
    
      padding-left: 50vw; 
    
      animation: scrollText 30s linear infinite; 
    } 
  
    .banner-content span { 
      padding-right: 50px; 
    } 
  
    @keyframes moveCheckerboard { 
      0% { 
        background-position: 0 0, 0 12px, 12px -12px, -12px 0px; 
      } 
      100% { 
        background-position: 24px 24px, 24px 36px, 36px 12px, 12px 24px; 
      } 
    } 
 
    @keyframes scrollText { 
      0% { 
        transform: translate3d(0, 0, 0); 
      } 
      100% { 
        transform: translate3d(-50%, 0, 0); 
      } 
    } 
  </style>
